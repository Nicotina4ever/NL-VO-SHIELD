name: Publish existing release

on:
  push:
    paths:
      - ".github/workflows/publish-existing.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (existing)"
        required: true
        default: "v1.2.3"
      run_id:
        description: "CI build run id containing the artifacts"
        required: true
        default: "41723936230"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Download verified CI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
          run-id: 41723936230
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove duplicate metadata files
        shell: bash
        run: |
          find release-assets -type f \( -name 'SHA256SUMS' -o -name 'BUILD-INFO.json' -o -name 'latest.json' \) -delete
          find release-assets -type f -maxdepth 2 -print
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release-assets
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3
          name: NL VO Shield v1.2.3
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: release-assets/**
