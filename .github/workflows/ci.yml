name: CI

# Build/test the public product only. The private research lab and any private
# data are intentionally NOT part of this workflow (and are git-ignored).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------ guards
  guards:
    name: Leak guard + icon check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Leak guard self-test
        run: node tooling/leak-guard.mjs --self-test
      - name: Leak guard (tracked/staged files)
        run: node tooling/leak-guard.mjs
      - name: Verify committed icons
        run: node tooling/gen-icons.mjs --check

  # ------------------------------------------------------------ python engine
  engine-tests:
    name: Engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      # setup-python is for BUILD/TEST convenience only: the shipped product
      # embeds its own runtime, it never depends on a system Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/engine/requirements*.txt
      - name: Install engine dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f packages/engine/requirements.txt ]; then
            python -m pip install -r packages/engine/requirements.txt
          fi
          python -m pip install -e packages/engine
          python -m pip install pytest
      - name: Run engine tests
        shell: bash
        run: |
          if [ ! -d packages/engine/tests ]; then
            echo "::error::packages/engine/tests is missing"
            exit 1
          fi
          python -m pytest packages/engine/tests -q

  # ---------------------------------------------------------------- frontend
  frontend:
    name: Frontend build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build frontend
        run: npm run build

  # --------------------------------------------------------------- rust host
  cargo-check:
    name: Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux system dependencies (WebKitGTK/GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Frontend build (Tauri context needs dist/)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  # ------------------------------------------------------------ OS bundles
  bundle:
    name: Bundle (${{ matrix.os }})
    needs: [engine-tests, cargo-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-14
            bundles: dmg,app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # setup-python here is ONLY used to run PyInstaller and assemble the
      # sidecar payload; the shipped product does not require system Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/engine/requirements*.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux system dependencies (WebKitGTK/GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Install engine build dependencies (PyInstaller only)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f packages/engine/requirements.txt ]; then
            python -m pip install -r packages/engine/requirements.txt
          fi
          python -m pip install -e packages/engine
          python -m pip install pyinstaller
          echo "NLVS_ENGINE_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Provision c2patool (Windows, build-time, checksum verified)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "bin/c2patool/c2patool"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://github.com/contentauth/c2patool/releases/download/v0.9.12/c2patool-v0.9.12-x86_64-pc-windows-msvc.zip"
          $sha = "729be50407ca20ad72077a729c7e233b4ff8b37b57cd28bca24fd3d5ef5315d4"
          $archive = Join-Path $env:TEMP "c2patool.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha) { throw "c2patool checksum mismatch: $actual" }
          Expand-Archive -Path $archive -DestinationPath $dir -Force
          $found = Get-ChildItem -Path $dir -Recurse -File -Filter "c2patool.exe" | Select-Object -First 1
          $dest = Join-Path $dir "c2patool.exe"
          if ($found.FullName -ne $dest) { Copy-Item $found.FullName $dest -Force }
          & $dest --version
      - name: Provision c2patool (macOS/Linux, build-time, checksum verified)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dir="bin/c2patool/c2patool"
          mkdir -p "$dir"
          if [ "$RUNNER_OS" = "Linux" ]; then
            url="https://github.com/contentauth/c2patool/releases/download/v0.9.12/c2patool-v0.9.12-x86_64-unknown-linux-gnu.tar.gz"
            sha="caa336747d5364e21e0eb7a307c108b6680b237ff8b8aa5ed94ab8e43d64214c"
            curl -fsSL "$url" -o /tmp/c2patool.dl
            echo "$sha  /tmp/c2patool.dl" | sha256sum -c -
            tar -xzf /tmp/c2patool.dl -C "$dir"
          else
            url="https://github.com/contentauth/c2patool/releases/download/v0.9.12/c2patool-v0.9.12-universal-apple-darwin.zip"
            sha="37284ab259513e9ddc22797a3956af7abad9cb390ed4ff3c6acaa45c350bd255"
            curl -fsSL "$url" -o /tmp/c2patool.dl
            echo "$sha  /tmp/c2patool.dl" | shasum -a 256 -c -
            unzip -q /tmp/c2patool.dl -d "$dir"
          fi
          found="$(find "$dir" -type f -name c2patool | head -n 1)"
          [ -n "$found" ] || { echo "::error::c2patool binary not found"; exit 1; }
          if [ "$found" != "$dir/c2patool" ]; then cp -f "$found" "$dir/c2patool"; fi
          chmod +x "$dir/c2patool"
          "$dir/c2patool" --version
      - name: Build engine sidecar (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tooling/build-engine-sidecar.ps1
      - name: Build engine sidecar (macOS/Linux)
        if: runner.os != 'Windows'
        run: bash tooling/build-engine-sidecar.sh
      - name: Build installer bundles
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File tooling/package.ps1 \
              -Bundles "${{ matrix.bundles }}" -SkipSidecar
          else
            bash tooling/package.sh --bundles "${{ matrix.bundles }}" --skip-sidecar
          fi
      - name: Verify bundles contain no private material
        shell: bash
        run: node tooling/leak-guard.mjs --scan dist
      - name: Show artifact sizes
        shell: bash
        run: |
          find dist -type f -maxdepth 3 -printf '%s  %p\n' 2>/dev/null || find dist -type f -maxdepth 3 -exec ls -l {} +
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nlvoshield-${{ runner.os }}-${{ matrix.bundles }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14
