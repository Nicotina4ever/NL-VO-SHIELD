name: Release

# Build signed (when the signing secret is configured) installer artifacts for all
# supported OSes and publish a GitHub Release on tag push.
#
# Signing:
#   - TAURI_SIGNING_PRIVATE_KEY (+ optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
#     is read from repository secrets. It is never written to the repository.
#   - latest.json (Tauri auto-update manifest) is attached ONLY when the build was
#     signed. Without the secret, artifacts are UNSIGNED and auto-update stays
#     disabled: the workflow states this instead of pretending otherwise.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-14
            bundles: dmg,app
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/engine/requirements*.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux system dependencies (WebKitGTK/GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Install engine build dependencies (PyInstaller only)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f packages/engine/requirements.txt ]; then
            python -m pip install -r packages/engine/requirements.txt
          fi
          python -m pip install -e packages/engine
          python -m pip install pyinstaller
          echo "NLVS_ENGINE_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Provision c2patool (Windows, build-time, checksum verified)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "bin/c2patool/c2patool"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://github.com/contentauth/c2patool/releases/download/v0.9.12/c2patool-v0.9.12-x86_64-pc-windows-msvc.zip"
          $sha = "729be50407ca20ad72077a729c7e233b4ff8b37b57cd28bca24fd3d5ef5315d4"
          $archive = Join-Path $env:TEMP "c2patool.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha) { throw "c2patool checksum mismatch: $actual" }
          Expand-Archive -Path $archive -DestinationPath $dir -Force
          $found = Get-ChildItem -Path $dir -Recurse -File -Filter "c2patool.exe" | Select-Object -First 1
          $dest = Join-Path $dir "c2patool.exe"
          if ($found.FullName -ne $dest) { Copy-Item $found.FullName $dest -Force }
          & $dest --version
      - name: Provision c2patool (macOS/Linux, build-time, checksum verified)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -u
          dir="bin/c2patool/c2patool"
          mkdir -p "$dir"
          echo "runner: $RUNNER_OS $(uname -m) / $(uname -s)"
          if [ "$RUNNER_OS" = "Linux" ]; then
            url="https://github.com/contentauth/c2patool/releases/download/v0.9.12/c2patool-v0.9.12-x86_64-unknown-linux-gnu.tar.gz"
            sha="caa336747d5364e21e0eb7a307c108b6680b237ff8b8aa5ed94ab8e43d64214c"
            curl -fsSL "$url" -o /tmp/c2patool.dl || { echo "::error::c2patool download failed"; exit 1; }
            echo "$sha  /tmp/c2patool.dl" | sha256sum -c - || { echo "::error::c2patool checksum mismatch"; exit 1; }
            tar -xzf /tmp/c2patool.dl -C "$dir" || { echo "::error::c2patool extraction failed"; exit 1; }
          else
            url="https://github.com/contentauth/c2patool/releases/download/v0.9.12/c2patool-v0.9.12-universal-apple-darwin.zip"
            sha="37284ab259513e9ddc22797a3956af7abad9cb390ed4ff3c6acaa45c350bd255"
            curl -fsSL "$url" -o /tmp/c2patool.dl || { echo "::error::c2patool download failed"; exit 1; }
            echo "$sha  /tmp/c2patool.dl" | shasum -a 256 -c - || { echo "::error::c2patool checksum mismatch"; exit 1; }
            unzip -q /tmp/c2patool.dl -d "$dir" || { echo "::error::c2patool extraction failed"; exit 1; }
          fi
          found="$(find "$dir" -type f -name 'c2patool*' -print -quit)"
          if [ -z "$found" ]; then
            echo "::error::c2patool binary not found after extraction"
            find "$dir" -maxdepth 3 -type f | head -20
            exit 1
          fi
          cp -f "$found" "$dir/c2patool"
          chmod +x "$dir/c2patool"
          file "$dir/c2patool" || true
          if ! "$dir/c2patool" --version; then
            echo "::error::c2patool --version failed on $RUNNER_OS"
            if [ "$RUNNER_OS" = "Linux" ]; then ldd "$dir/c2patool" || true; else otool -L "$dir/c2patool" || true; fi
            exit 1
          fi
      - name: Build engine sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "sidecar-build.log"
          pwsh -NoProfile -ExecutionPolicy Bypass -File tooling/build-engine-sidecar.ps1 -SkipRuntime *>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            Get-Content $log -Tail 40 | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
      - name: Build engine sidecar (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -u
          log="$RUNNER_TEMP/sidecar-build.log"
          if ! bash tooling/build-engine-sidecar.sh --skip-runtime 2>&1 | tee "$log"; then
            tail -40 "$log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Build release bundles
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File tooling/package.ps1 \
              -Bundles "${{ matrix.bundles }}" -SkipSidecar
          else
            bash tooling/package.sh --bundles "${{ matrix.bundles }}" --skip-sidecar
          fi
      - name: Report signing state
        shell: bash
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "Signing key present: updater artifacts (.sig) must accompany the installers."
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not configured - artifacts are UNSIGNED and auto-update is disabled."
          fi
      - name: Verify bundles contain no private material
        shell: bash
        run: node tooling/leak-guard.mjs --scan dist
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ matrix.bundles }}
          path: dist/**
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Compute release version and checksums
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd release-assets
          find . -type f ! -name 'latest.json' ! -name 'SHA256SUMS' -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS || true
          cat SHA256SUMS || true
      - name: Generate updater manifest (only if signed)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        run: |
          if ! find release-assets -name '*.sig' -print -quit | grep -q .; then
            echo "::warning::Signing key present but no .sig artifacts were produced (updater artifacts not configured in tauri.conf.json); skipping latest.json."
            exit 0
          fi
          node tooling/make-latest-json.mjs \
            --dist release-assets \
            --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --out release-assets/latest.json
      - name: State update policy (unsigned build)
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        shell: bash
        run: |
          echo "::warning::No signing key: publishing UNSIGNED artifacts. Tauri auto-update is disabled (no latest.json)."
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NL VO Shield ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            release-assets/**
